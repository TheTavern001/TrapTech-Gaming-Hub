# Render Blueprint for The Gaming Hub (Node + SQLite on a persistent disk).
# Deploy: Render Dashboard > New > Blueprint > pick this repo. You'll be prompted for ADMIN_PASSWORD.
#
# Cost / plan tradeoff:
#   plan: starter (0.5 CPU / 512 MB, ~$7/mo) + 1 GB disk (~$0.25/mo) = about $7.25/mo.
#   Persistent disks only work on paid plans. If you switch to `plan: free`, you must also delete the
#   `disk:` block, and then the SQLite database (players, scores, giveaways, bookings) is WIPED on every
#   restart/redeploy and the service sleeps after 15 min idle. Free is only OK for a throwaway preview.
#   Note: a service with a disk can't scale past 1 instance and has a few seconds of downtime per deploy.
services:
  - type: web
    name: gaming-hub
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: hub-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false        # you type this in during Blueprint setup (use a long random password)
      - key: SECRET
        generateValue: true # signs sessions + anti-cheat run tokens and salts IP hashes
