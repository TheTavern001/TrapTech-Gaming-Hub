<g stroke="#4a52b8" stroke-opacity=".4" fill="none"><path d="M0 275L300 100 600 275M0 310L300 130 600 310M0 345L300 160 600 345"/><path d="M100 360L270 95M220 360L290 95M380 360L310 95M500 360L330 95"/></g>
