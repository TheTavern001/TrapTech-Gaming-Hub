<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Neon Circuit</title><desc id="desc">Original neon arcade racer cover art with a glowing hover racer on a futuristic track.</desc>
