<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trap Tech twin-T crown app icon">
<title>Trap Tech — Twin T Crown</title>
<defs>
  <linearGradient id="crownGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b4"/><stop offset=".42" stop-color="#f4b84e"/><stop offset=".76" stop-color="#d68a2b"/><stop offset="1" stop-color="#ffe49a"/></linearGradient>
  <linearGradient id="monogram" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6f5"/></linearGradient>
</defs>
<rect width="512" height="512" rx="108" fill="#030b27"/>
<!-- Fine-line crown with open negative space; no heavy filled crown silhouette. -->
<path d="M143 193 111 119 185 169 220 102 256 162 292 102 327 169 401 119 369 193" fill="none" stroke="url(#crownGold)" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
<path d="M142 196 Q256 168 370 196" fill="none" stroke="url(#crownGold)" stroke-width="12" stroke-linecap="round"/>
<!-- Two distinct, tapered T forms echo the existing Trap Tech monogram. -->
<path d="M74 232 H231 L251 254 H202 V392 L169 425 V282 H117 Z" fill="url(#monogram)"/>
<path d="M438 232 H281 L261 254 H310 V392 L343 425 V282 H395 Z" fill="url(#monogram)"/>
<!-- Hairline center separation keeps the twin-T mark readable at small sizes. -->
<path d="M256 255 V423" stroke="#030b27" stroke-width="10"/>
</svg>