name: V1 launch syntax checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Test Stripe checkout and signed webhook integration (local mock; no real charges)
        run: npm run test:stripe
      - name: Test Cloudflare R2 signing and storage (mock endpoint; no real account)
        run: npm run test:r2
      - name: Test checklist normalization
        env:
          ADMIN_PASSWORD: v1-check-password-123
          SECRET: v1-check-secret-for-tests-only
          DATA_DIR: /tmp/gaming-hub-v1-checklist-test
        run: node tools/v1-checklist-test.js
      - name: Test cosmetic-only economy invariants
        env:
          ADMIN_PASSWORD: v1-check-password-123
          SECRET: v1-check-secret-for-tests-only
          DATA_DIR: /tmp/gaming-hub-v1-economy-test
        run: node tools/e2e-cosmetic-economy.js
      - name: Check server-side JavaScript
        run: |
          bash -n tools/run-all.sh
          node --check tools/e2e-stripe.js
          node --check tools/e2e-cloudflare-r2.js
          node --check src/db.js
          node --check src/server.js
          node --check src/monetize.js
          node --check tools/e2e-stripe.js
          node --check src/admin-media.js
          node --check src/r2.js
          node --check src/eligibility.js
          node --check src/v5.js
          node --check src/avatars.js
          node --check src/admin-giveaways.js
          node --check src/admin-ui/admin-builder.js
      - name: Check browser ES modules
        run: |
          node --input-type=module --check < public/js/gw-v7.js
          node --input-type=module --check < public/js/app.js
          node --input-type=module --check < public/js/avatar-editor.js
          node --input-type=module --check < public/js/avatar-3d.js
          node --input-type=module --check < public/js/hub-store.js
