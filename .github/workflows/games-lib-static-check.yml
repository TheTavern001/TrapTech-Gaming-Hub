name: Games Library static checks

on:
  pull_request:
  push:
    branches:
      - main
      - v7-wip
      - games-lib-integrity-audit

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax of changed Kit games and audit tools
        run: |
          node --check src/games-lib.js
          node --input-type=module --check < public/js/app.js
          node --check public/games-lib/adapter.js
          node --check public/games-lib/neon-circuit/game.js
          node --check public/games-lib/rift-survival/game.js
          node --check tools/games-lib-integrity-audit.js
          node --check tools/games-lib-static-check.js
          node --check tools/e2e-games-lib.js
          node --check tools/e2e-hub-library.js
      - name: Parse inline JavaScript in the library page
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('public/games-lib/index.html','utf8'); const blocks=[...s.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/gi)]; if(!blocks.length) throw Error('No inline library script found'); for(const b of blocks) new Function(b[1]); console.log('Library inline script syntax OK');"
      - name: Check registry, catalog, docs and local assets
        run: node tools/games-lib-static-check.js
